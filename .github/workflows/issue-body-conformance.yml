# Issue-body conformance lint (Story #4227).
#
# Generated by agents-bootstrap-github. Runs the canonical story-body parser
# against human-opened type::story issues and comments when the
# body does not round-trip, instead of letting the supported human entry
# points (e.g. /mandrel-plan from an existing Epic ID) fail silently later. The lint
# informs; it never fails the issue. Re-run /agents-bootstrap-github to refresh.
name: Issue Body Conformance

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-body-conformance-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Parse issue body
    runs-on: ubuntu-latest
    # Story #4936: checkout, setup-node, and one Node script that reads an
    # issue body. 10 minutes is the gate's floor and ample here.
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # `.nvmrc` is the sole Node SSOT for every workflow in this repo — never
          # re-state the version literal here (Story #4081, re-detected as #4784).
          node-version-file: .nvmrc

      - name: Lint issue body
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .agents/scripts/lint-issue-body.js
